apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pago-mysql
  namespace: pago
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pago-mysql
  template:
    metadata:
      labels:
        app: pago-mysql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pago-mysql
          image: mysql:5.6
          ports:
            - name: tpc
              protocol: TCP
              containerPort: 3306
          imagePullPolicy: Always
      restartPolicy: Always

  volumeClaimTemplates:
    - metadata:
        name: pago-mysql-data
      spec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
